server:
  port: 8080
  host: "127.0.0.1"
  dummy_api_key: "" # Optional proxy-wide key for auth. Leave blank for localhost access.

keys:
  # Example configuration - paste your actual API keys and change status to "active"
  - id: "groq_default"
    provider: "groq"
    model: "llama-3.3-70b-versatile"
    api_key: "PASTE_YOUR_GROQ_API_KEY_HERE"
    status: "disabled"

  - id: "google_default"
    provider: "google"
    model: "gemini-2.5-flash"
    api_key: "PASTE_YOUR_GOOGLE_STUDIO_API_KEY_HERE"
    status: "disabled"

routes:
  # Route alias: large (for high-capability reasoning tasks)
  - name: "Large Model Route"
    model_alias: "large"
    chain:
      - provider: "cohere"
        model: "command-r-plus"
      - provider: "groq"
        model: "llama-3.3-70b-versatile"
    fallback:
      - provider: "google"
        model: "gemini-2.5-pro"

  # Route alias: fast (for quick completions and lightweight tasks)
  - name: "Fast Model Route"
    model_alias: "fast"
    chain:
      - provider: "google"
        model: "gemini-2.5-flash"
      - provider: "groq"
        model: "llama-3.1-8b-instant"
    fallback:
      - provider: "github"
        model: "gpt-4o-mini"

  # Route alias: default (standard fallback route)
  - name: "Default Route"
    model_alias: "default"
    chain:
      - provider: "google"
        model: "gemini-2.5-flash"
    fallback:
      - provider: "groq"
        model: "llama-3.3-70b-versatile"

providers:
  groq:
    reset_behavior: "rolling_24h"
  google:
    reset_behavior: "midnight_pt"
  cerebras:
    reset_behavior: "continuous"
  mistral:
    reset_behavior: "none"
